<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        /* Background Image Styling */
        body {
            background-image: url('https://images.pexels.com/photos/221016/pexels-photo-221016.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'); /* Replace with your background image URL */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Styling */
        .form-container {
            background-color: rgba(255, 255, 255, 0.85); /* Transparent white background */
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .form-title {
            font-size: 2rem;
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-submit {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            width: 100%;
            color: white;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        /* Custom Styling for Form Inputs */
        .form-control {
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Crop Recommendation Form</h2>
        <form action="/recommend_crop" method="POST">
            <div class="mb-3">
                <label for="N" class="form-label">Nitrogen (N)</label>
                <input type="number" class="form-control" id="N" name="N" required>
            </div>
            <div class="mb-3">
                <label for="P" class="form-label">Phosphorus (P)</label>
                <input type="number" class="form-control" id="P" name="P" required>
            </div>
            <div class="mb-3">
                <label for="K" class="form-label">Potassium (K)</label>
                <input type="number" class="form-control" id="K" name="K" required>
            </div>
            <div class="mb-3">
                <label for="temperature" class="form-label">Temperature (°C)</label>
                <input type="number" step="0.1" class="form-control" id="temperature" name="temperature" required>
            </div>
            <div class="mb-3">
                <label for="humidity" class="form-label">Humidity (%)</label>
                <input type="number" class="form-control" id="humidity" name="humidity" required>
            </div>
            <div class="mb-3">
                <label for="ph" class="form-label">pH Level</label>
                <input type="number" step="0.1" class="form-control" id="ph" name="ph" required>
            </div>
            <div class="mb-3">
                <label for="rainfall" class="form-label">Rainfall (mm)</label>
                <input type="number" step="0.1" class="form-control" id="rainfall" name="rainfall" required>
            </div>
            <button type="submit" class="btn btn-submit">Submit</button>
        </form>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
