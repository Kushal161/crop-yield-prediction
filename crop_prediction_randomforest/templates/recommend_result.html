<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation Result</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background-image: url('https://images.pexels.com/photos/221016/pexels-photo-221016.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'); /* Replace with your background image */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .result-container {
            background-color: rgba(255, 255, 255, 0.9); /* White with some transparency */
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .result-title {
            font-size: 2.5rem;
            color: #007bff;
            margin-bottom: 20px;
        }

        .result-text {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #343a40;
        }

        .back-button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;
            display: inline-block;
        }

        .back-button:hover {
            background-color: #218838;
            color: white;
        }
    </style>
</head>
<body>

    <div class="result-container">
        <h2 class="result-title">Recommended Crop</h2>
        <p class="result-text">The recommended crop for the given conditions is: <strong>{{ crop }}</strong></p>
        <a href="/" class="back-button">Go back to Home</a>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
