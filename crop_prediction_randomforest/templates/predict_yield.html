<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Prediction</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background-image: url('https://images.pexels.com/photos/1146717/pexels-photo-1146717.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'); /* Replace with your background image URL */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .form-title {
            font-size: 2rem;
            color: #343a40;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-submit {
            background-color: #28a745;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            width: 100%;
            color: white;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Crop Yield Prediction Form</h2>
        <form action="/predict_yield" method="POST">
            <div class="mb-3">
                <label for="crop" class="form-label">Select Crop</label>
                <select class="form-select" id="crop" name="crop" required>
                    <option value="">-- Choose Crop --</option>
                    <option value="maize">Maize</option>
                    <option value="Potatoes">Potatoes</option>
                    <option value="rice">Rice</option>
                    <option value="Sorghum">Sorghum</option>
                    <option value="Soybeans">Soybeans</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Cassava">Cassava</option>
                    <option value="Sweet potatoes">Sweet Potatoes</option>
                    <option value="banana">Banana</option>
                    <option value="Yams">Yams</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="rainfall" class="form-label">Rainfall (mm)</label>
                <input type="number" step="0.1" class="form-control" id="rainfall" name="rainfall" required>
            </div>
            <div class="mb-3">
                <label for="avg_temp" class="form-label">Average Temperature (°C)</label>
                <input type="number" step="0.1" class="form-control" id="avg_temp" name="avg_temp" required>
            </div>
            <button type="submit" class="btn btn-submit">Predict Yield</button>
        </form>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
